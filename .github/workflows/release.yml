name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Crea el release vacío una sola vez; cada build sube sus archivos después.
  create:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes

  build:
    needs: create
    # En workflow_dispatch no hay release: se compila igual.
    if: always() && (needs.create.result == 'success' || needs.create.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: x86_64-linux
          - os: macos-14
            target: aarch64-apple-darwin
            platform: aarch64-macos
          - os: macos-14
            target: x86_64-apple-darwin
            platform: x86_64-macos
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools
          fi
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable

      - name: Test
        # Los tests corren en la arquitectura nativa del runner.
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Check binary is static
        if: runner.os == 'Linux'
        run: |
          file "target/$TARGET/release/voxrepository-tui"
          if ldd "target/$TARGET/release/voxrepository-tui" 2>&1 | grep -q "=>"; then
            echo "El binario tiene dependencias dinamicas" >&2
            exit 1
          fi

      - name: Package
        run: |
          tag="${GITHUB_REF_NAME}"
          name="voxrepository-tui-${tag}-${PLATFORM}"
          mkdir -p "dist/${name}"
          cp "target/$TARGET/release/voxrepository-tui" README.md config/voxrepository.example.toml "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          fi
          ls -l dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: voxrepository-tui-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

      - name: Publish assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.sha256 --clobber
